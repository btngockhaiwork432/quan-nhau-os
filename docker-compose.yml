version: "3.8"

services:
  quannhau-db:
    image: postgres:16-alpine
    container_name: quannhau-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quannhau2026
      POSTGRES_DB: quan_nhau_os
    volumes:
      - quannhau_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quan_nhau_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  quannhau-app:
    build: .
    container_name: quannhau-app
    restart: unless-stopped
    depends_on:
      quannhau-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:quannhau2026@quannhau-db:5432/quan_nhau_os
      PORT: "8765"
    ports:
      - "127.0.0.1:8765:8765"

volumes:
  quannhau_pgdata:
